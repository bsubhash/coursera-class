<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Location Overlay</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 20%;
        }
        .location {
            font-size: 1.5em;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Live Location</h1>
    <div class="location" id="location">Fetching location...</div>

    <script>
        // OpenWeather API key
        const API_KEY = "YOUR_OPENWEATHER_API_KEY";

        // Function to fetch the location name from OpenWeather API
        async function fetchLocationName(latitude, longitude) {
            try {
                const response = await fetch(
                    `https://api.openweathermap.org/geo/1.0/reverse?lat=${latitude}&lon=${longitude}&limit=1&appid=${API_KEY}`
                );

                if (!response.ok) {
                    throw new Error("Failed to fetch location");
                }

                const data = await response.json();

                if (data && data.length > 0) {
                    const locationName = `${data[0].name}, ${data[0].country}`;
                    document.getElementById("location").textContent = locationName;
                } else {
                    document.getElementById("location").textContent = "Location not found";
                }
            } catch (error) {
                console.error("Error fetching location:", error);
                document.getElementById("location").textContent = "Error fetching location";
            }
        }

        // Function to handle GPS tag updates
        function onGPSTagUpdate(gpsData) {
            const { latitude, longitude } = gpsData;

            if (latitude && longitude) {
                // Fetch and update location name
                fetchLocationName(latitude, longitude);
            } else {
                document.getElementById("location").textContent = "Invalid GPS data";
            }
        }

        // Simulate Larix GPS tags (Replace this with actual Larix integration)
        // Use a mock GPS tag update every few seconds for demonstration
        setInterval(() => {
            // Replace this simulated data with the actual GPS tags
            const mockGPSData = {
                latitude: 40.73061, // Replace with live GPS latitude
                longitude: -73.935242, // Replace with live GPS longitude
            };
            onGPSTagUpdate(mockGPSData);
        }, 5000);
    </script>
</body>
</html>
