<!DOCTYPE html>
<html>
<head>
<title>Overlay</title>
<style>
body { margin: 0; }
#overlay {
  position: relative;
  width: 1920px;
  height: 1080px;
  overflow: hidden;
  background-color: transparent; /* Overlay transparency */
}
#live-score {
  width: 1400px;
  height: 787.5px;
  transform-origin: top left;
  transform: scale(1.9444);
  position: absolute;
  top: -765px; /* Adjusted top */
  left: 260;
  background-color: transparent;
  clip-path: inset(765px 0 0 0); /* Adjusted clip-path */
}
.logo {
  position: absolute;
  background-size: contain;
  background-repeat: no-repeat;
}
#logo1 {
  top: 40px;
  left: 75px;
  width: 150px;
  height: 100px;
}
#logo2 {
  top: 40px;
  left: 225px;
  width: 150px;
  height: 100px;
}
.image-cycle {
    position: absolute;
    width: 85px;
    height: 190px;
    background-size: contain;
    background-repeat: no-repeat;
}
#image-cycle-left {
    bottom: 0px;
    left: 0px;
}
#image-cycle-right {
    bottom: 0px;
    right: 0px;
}
</style>
</head>
<body>

<div id="overlay">
  <iframe id="live-score" src="https://cricclubs.com/live/CricClubsLive.do?fixtureId=3514&clubId=95"></iframe>
  <div id="logo1" class="logo"></div>
  <div id="logo2" class="logo"></div>
    <div id="image-cycle-left" class="image-cycle"></div>
    <div id="image-cycle-right" class="image-cycle"></div>
</div>

<script>
  function updateIframe(fixtureId, clubId) {
    const iframe = document.getElementById('live-score');
    iframe.src = `https://cricclubs.com/live/CricClubsLive.do?fixtureId=${fixtureId}&clubId=${clubId}`;
  }

  updateIframe(3514, 95);

    function cycleImages(elementId, folder) {
        const imageCycle = document.getElementById(elementId);
        let imageCount = 0;

        for (let i = 1; i <= 100; i++) {
            const img = new Image();
            img.src = `${folder}/image${i}.jpg`;
            img.onload = () => {
                if (i > imageCount) {
                    imageCount = i;
                }
            };
            img.onerror = () => { };
        }

        let currentImage = 1;
        setInterval(() => {
            imageCycle.style.backgroundImage = `url(${folder}/image${currentImage}.jpg)`;
            currentImage = (currentImage % imageCount) + 1;
        }, 10000);
    }

    cycleImages("image-cycle-left", "lads");
    cycleImages("image-cycle-right", "rads");

  document.getElementById("logo1").style.backgroundImage = "url('crickai_uhd2.png')";
  document.getElementById("logo2").style.backgroundImage = "url('path/to/MKYN.png')";

</script>

</body>
</html>
