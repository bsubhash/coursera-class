<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Section Extractor Overlay</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: transparent;
            overflow: hidden;
            width: 1920px;
            height: 1080px;
            font-family: Arial, sans-serif;
        }

        /* Bottom overlay strip - 1920x300 for the extracted 300px section */
        .bottom-overlay {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 1920px;
            height: 300px;
            background: transparent;
            z-index: 1000;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            padding: 0;
        }

        /* Container for the extracted section */
        .extracted-container {
            width: 300px;
            height: 100px;
            background: rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        /* Canvas for the extracted HTML section */
        .extracted-canvas {
            width: 300px;
            height: 100px;
            display: block;
            image-rendering: crisp-edges;
        }

        /* Debug info (removable) */
        .debug-info {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            font-family: monospace;
            z-index: 1001;
            max-width: 300px;
        }

        .debug-info.hidden {
            display: none;
        }

        /* Status indicator */
        .status {
            position: fixed;
            bottom: 110px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 11px;
            z-index: 1001;
        }

        .live-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: #00ff00;
            border-radius: 50%;
            margin-right: 5px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <!-- Debug info panel -->
    <div class="debug-info" id="debugInfo">
        <strong>HTML Section Extractor</strong><br>
        Source: 300x1200 hypothetical page<br>
        Extract: Y-pixels 300-400 (100px height)<br>
        Output: 300x100 in bottom-left overlay<br>
        <br>
        <button onclick="toggleDebug()" style="background:#333;color:white;border:1px solid #666;padding:3px 8px;border-radius:3px;cursor:pointer;">Hide Debug</button>
    </div>

    <!-- Status indicator -->
    <div class="status">
        <span class="live-dot"></span>
        <span id="statusText">Extracting...</span>
    </div>

    <!-- Bottom overlay containing extracted section -->
    <div class="bottom-overlay">
        <div class="extracted-container">
            <canvas id="extractedCanvas" class="extracted-canvas" width="300" height="100"></canvas>
        </div>
    </div>

    <script>
        // Configuration for extraction
        const extractionConfig = {
            sourceWidth: 300,
            sourceHeight: 1200,
            extractY: 300,        // Start extraction at Y-pixel 300
            extractHeight: 100,   // Extract 100 pixels (rows 300-400)
            outputWidth: 300,
            outputHeight: 100,
            autoUpdate: true,
            updateInterval: 3000
        };

        let updateInterval;

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            initializeExtractor();
            startAutoUpdate();
            
            // Hide debug after 15 seconds
            setTimeout(() => {
                document.getElementById('debugInfo').classList.add('hidden');
            }, 15000);
        });

        function initializeExtractor() {
            updateStatus('Ready');
            simulateExtraction();
        }

        function startAutoUpdate() {
            if (extractionConfig.autoUpdate) {
                updateInterval = setInterval(simulateExtraction, extractionConfig.updateInterval);
            }
        }

        // Simulate extracting a section from a hypothetical rendered HTML page
        function simulateExtraction() {
            const canvas = document.getElementById('extractedCanvas');
            const ctx = canvas.getContext('2d');
            
            // Clear canvas
            ctx.clearRect(0, 0, 300, 100);
            
            // Simulate extracted HTML content (this would be real page content in practice)
            renderExtractedSection(ctx);
            
            updateStatus('Updated');
        }

        function renderExtractedSection(ctx) {
            // Simulate what would be extracted from pixels 300-400 of the ECB scorecard
            
            // Background (as it would appear in the original page)
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, 300, 100);
            
            // Simulate ECB scorecard section content
            
            // Team name area
            ctx.fillStyle = '#f8f9fa';
            ctx.fillRect(0, 0, 300, 25);
            
            ctx.fillStyle = '#1e40af';
            ctx.font = 'bold 14px Arial';
            ctx.fillText('County Championship - Division 1', 10, 18);
            
            // Score section
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 25, 150, 75);
            ctx.fillStyle = '#000000';
            ctx.font = 'bold 16px Arial';
            ctx.fillText('Team A', 10, 45);
            ctx.font = 'bold 20px Arial';
            ctx.fillText('245/6', 10, 68);
            ctx.font = '12px Arial';
            ctx.fillText('78.2 overs', 10, 85);
            ctx.fillText('RR: 3.14', 10, 97);
            
            // VS divider
            ctx.fillStyle = '#e5e7eb';
            ctx.fillRect(150, 25, 1, 75);
            
            // Second team
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(151, 25, 149, 75);
            ctx.fillStyle = '#000000';
            ctx.font = 'bold 16px Arial';
            ctx.fillText('Team B', 160, 45);
            ctx.font = 'bold 20px Arial';
            ctx.fillText('312 & 89/3', 160, 68);
            ctx.font = '12px Arial';
            ctx.fillText('25.4 overs', 160, 85);
            ctx.fillText('Lead by 156', 160, 97);
            
            // Add some visual elements to show this is "extracted" content
            ctx.strokeStyle = '#ddd';
            ctx.lineWidth = 1;
            ctx.strokeRect(0, 0, 300, 100);
        }

        function updateStatus(message) {
            document.getElementById('statusText').textContent = message;
        }

        function toggleDebug() {
            const debugPanel = document.getElementById('debugInfo');
            debugPanel.classList.toggle('hidden');
        }

        // Public API for real implementation
        window.extractorAPI = {
            
            // Function to extract from a real HTML element
            extractFromElement: function(sourceElement, x, y, width, height) {
                const canvas = document.getElementById('extractedCanvas');
                const ctx = canvas.getContext('2d');
                
                // In a real implementation, this would use html2canvas or similar
                // to capture the specified region of the sourceElement
                
                try {
                    // Pseudo-code for real extraction:
                    // html2canvas(sourceElement, {
                    //     x: x,
                    //     y: y, 
                    //     width: width,
                    //     height: height,
                    //     scale: 1
                    // }).then(function(canvas) {
                    //     ctx.drawImage(canvas, 0, 0);
                    // });
                    
                    updateStatus('Real extraction would happen here');
                } catch (error) {
                    console.error('Extraction failed:', error);
                    updateStatus('Extraction failed');
                }
            },
            
            // Configure extraction parameters
            configure: function(config) {
                Object.assign(extractionConfig, config);
                simulateExtraction();
            },
            
            // Manual trigger
            extract: function() {
                simulateExtraction();
            },
            
            // Start/stop auto updates
            setAutoUpdate: function(enabled, interval = 3000) {
                extractionConfig.autoUpdate = enabled;
                extractionConfig.updateInterval = interval;
                
                if (updateInterval) {
                    clearInterval(updateInterval);
                }
                
                if (enabled) {
                    startAutoUpdate();
                }
            }
        };

        // Console help
        console.log(`
        HTML Section Extractor API:
        
        extractorAPI.configure({
            extractY: 250,        // Change Y-position to extract
            extractHeight: 120,   // Change height of extraction
            autoUpdate: true,     // Enable/disable auto-updates
            updateInterval: 5000  // Update frequency in ms
        });
        
        extractorAPI.extract();                    // Manual extraction
        extractorAPI.setAutoUpdate(false);        // Stop auto-updates
        extractorAPI.setAutoUpdate(true, 2000);   // Auto-update every 2 seconds
        
        For real implementation, replace simulateExtraction() with:
        1. html2canvas library for client-side capture
        2. Server-side rendering with Puppeteer
        3. Browser extension with broader permissions
        `);
    </script>
</body>
</html>
