<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webpage Section Clipper</title>
    <style>
        /* The body must be transparent to act as an overlay in streaming software */
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: transparent;
        }

        /* * This is the "clipping mask" or "window".
         * It's a 300x100 pixel box positioned at the bottom-left of the screen.
         * 'overflow: hidden' is the key property that hides any part of the
         * iframe that extends beyond this div's boundaries.
         * We add position: relative so the overlay inside can be positioned correctly.
        */
        .clipper {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 300px;
            height: 100px; /* The height of the section we want to show (400 - 300) */
            overflow: hidden;
            /* Optional: Add a subtle border or shadow if you like */
            /* box-shadow: 0 0 15px rgba(0,0,0,0.5); */
        }

        /* * This is the iframe that contains the target website.
         * We position it absolutely within the '.clipper' div.
         * By setting 'top: -300px', we shift the entire 1200px tall iframe
         * upwards by 300 pixels. This makes the 300px-400px vertical
         * section of the source page visible inside our 100px tall clipper.
        */
        .clipper iframe {
            position: absolute;
            top: -300px;
            left: 0;
            width: 300px;
            height: 1200px;
            border: 0;
            /* This helps prevent the user from accidentally interacting with the iframe */
            pointer-events: none; 
        }

        /* --- UPDATED ---
         * This is the semi-transparent overlay.
         * It now uses a linear-gradient for a smoother effect.
        */
        .color-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* A light grey gradient from left to right. You can change the direction and colors. */
            background: linear-gradient(to right, rgba(225, 225, 225, 0.7), rgba(225, 225, 225, 0.3));
            pointer-events: none; /* Ensures it doesn't block interaction */
        }
    </style>
</head>
<body>
    <!-- 
      The clipper div now holds both the iframe and the color overlay.
    -->
    <div class="clipper">
        <iframe 
            src="https://live.nvplay.com/ecb/?tab=m_scorecard#m1a1effdb-03da-413a-a8dc-e02c0870b9e6" 
            scrolling="no"
            title="Live Scorecard Source">
        </iframe>
        <!-- This new div creates the color tint -->
        <div class="color-overlay"></div>
    </div>

</body>
</html>
