<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather and Time Widgets</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f4f4f4;
        }
        .widget {
            width: 3840px;
            height: 170px;
            padding: 20px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #time-widget {
            text-align: left;
        }
        #weather-widget {
            text-align: right;
        }
        p {
            margin: 0;
            font-size: 1.5rem;
        }
    </style>
</head>
<body>
    <!-- Location and Time Widget -->
    <div class="widget" id="time-widget">
        <p id="location">Location: Detecting...</p>
        <p id="date">Date: </p>
        <p id="time">Time: </p>
    </div>

    <!-- Weather Widget -->
    <div class="widget" id="weather-widget">
        <p id="weather">Weather: </p>
        <p id="humidity">Humidity: </p>
        <p id="wind">Wind: </p>
    </div>

    <script>
        // Update Date and Time
        function updateTime() {
            const now = new Date();
            const date = now.toLocaleDateString("en-GB", {
                day: "2-digit",
                month: "long",
                year: "numeric"
            });
            const time = now.toLocaleTimeString("en-GB", {
                hour: "2-digit",
                minute: "2-digit",
                hour12: true
            });
            document.getElementById('date').textContent = `Date: ${date}`;
            document.getElementById('time').textContent = `Time: ${time}`;
        }

        setInterval(updateTime, 1000);
        updateTime();

        // Fetch Weather Data
        const apiKey = "YOUR_API_KEY";

        function fetchWeather(lat, lon) {
            const apiUrl = `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&units=imperial&appid=${apiKey}`;
            fetch(apiUrl)
                .then(response => response.json())
                .then(data => {
                    const city = data.name;
                    const weather = data.weather[0].description;
                    const humidity = data.main.humidity;
                    const wind = data.wind.speed;

                    document.getElementById('location').textContent = `Location: ${city}`;
                    document.getElementById('weather').textContent = `Weather: ${weather}`;
                    document.getElementById('humidity').textContent = `Humidity: ${humidity}%`;
                    document.getElementById('wind').textContent = `Wind: ${wind} m/s`;
                })
                .catch(error => {
                    console.error("Error fetching weather data:", error);
                    document.getElementById('location').textContent = `Location: Unable to detect`;
                });
        }

        // Get Location from GPS
        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    position => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        fetchWeather(lat, lon);
                    },
                    error => {
                        console.error("Error getting location:", error);
                        document.getElementById('location').textContent = `Location: Unable to detect`;
                    }
                );
            } else {
                document.getElementById('location').textContent = `Location: Not supported`;
            }
        }

        getLocation();
    </script>
</body>
</html>
