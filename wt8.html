<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Location Overlay</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 20%;
            background: rgba(0, 0, 0, 0.5);
            color: white;
        }
        .location {
            font-size: 1.5em;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Live Location</h1>
    <div class="location" id="location">Fetching location...</div>

    <script>
        // OpenWeather API key
        const API_KEY = '14d31962c93bbd59c7b96fab3aeabcb4';

        // Function to fetch the location name from OpenWeather API
        async function fetchLocationName(latitude, longitude) {
            try {
                const response = await fetch(
                    `https://api.openweathermap.org/geo/1.0/reverse?lat=${latitude}&lon=${longitude}&limit=1&appid=${API_KEY}`
                );

                if (!response.ok) {
                    throw new Error('Failed to fetch location');
                }

                const data = await response.json();

                if (data && data.length > 0) {
                    const locationName = `${data[0].name}, ${data[0].country}`;
                    document.getElementById('location').textContent = locationName;
                } else {
                    document.getElementById('location').textContent = 'Location not found';
                }
            } catch (error) {
                console.error('Error fetching location:', error);
                document.getElementById('location').textContent = 'Error fetching location';
            }
        }

        // Function to extract GPS data from Larix tags
        function extractGPSData() {
            const gpsTag = '<% gps_coord(dd) %>';
            const [latitude, longitude] = gpsTag.split(',').map(coord => parseFloat(coord.trim()));
            
            if (!isNaN(latitude) && !isNaN(longitude)) {
                document.getElementById('location').textContent = `Latitude: ${latitude}, Longitude: ${longitude}`;
                fetchLocationName(latitude, longitude);
            } else {
                document.getElementById('location').textContent = `Invalid GPS data. Parsed values: Latitude = ${latitude}, Longitude = ${longitude}`;
            }

        }

        // Periodically update the location
        setInterval(extractGPSData, 5000); // Update every 5 seconds
    </script>
</body>
</html>
