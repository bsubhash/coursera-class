<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centered 1280x720 Scaled to 1920x1080</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000; /* Black background to avoid tiling */
            overflow: hidden;
        }
        .container {
            width: 1280px;
            height: 720px;
            transform-origin: center; /* Scale from the center */
            transform: scale(1.5); /* Scale from 1280x720 to 1920x1080 */
            border: 2px solid #ccc;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <iframe src="https://cricclubs.com/live/CricClubsLive.do?fixtureId=3494&clubId=95" title="CricClubs Live"></iframe>
    </div>
</body>
</html>
