<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scaled Web Page</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000;
        }

        .scaled-container {
            width: 1280px;
            height: 720px;
            transform: scale(1.5); /* Scale 1280x720 to 3840x2160 */
            transform-origin: top left;
            overflow: hidden;
        }

        iframe {
            width: 1280px;
            height: 720px;
            border: none;
        }
    </style>
</head>
<body>
    <div class="scaled-container">
        <iframe src="https://cricclubs.com/CricClubsLive.do?fixtureId=998&clubId=1001307"></iframe>
    </div>
</body>
</html>
