<!DOCTYPE html>
<html>
<head>
<style>
body {
  background-color: transparent;
  font-family: monospace;
  position: relative;
  width: 100vw;
  height: 0;
  padding-bottom: 56.25%;
  overflow: hidden;
}

.container {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 5px 10px;
  font-size: 14px;
  position: fixed;
  bottom: 2.3vh;
  right: 2.3vw;
  font-weight: bold;
  background-color: rgba(128, 128, 128, 0.3);
  box-shadow: 0px 2px 4px rgba(0, 0, 0, 0.2);
}

#time, #date {
  color: rgb(10, 10, 225); /* Set both time and date to blue */
  background: -webkit-linear-gradient(top, rgb(10, 10, 255), rgb(10, 10, 200)); /* Add a subtle gradient */
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

#date {
  margin-top: -5px; /* Reduce the gap between time and date */
}
</style>
</head>
<body>

<div class="container">
  <span id="time"></span><br>
  <span id="date"></span>
</div>

<script>
function updateDateTime() {
  const now = new Date();
  const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
  const dateString = now.toLocaleDateString([], { month: 'long', day: 'numeric', year: 'numeric' }); // Use full month name
  
  document.getElementById('time').textContent = timeString;
  document.getElementById('date').textContent = dateString;
}

// Update initially and then every second
updateDateTime();
setInterval(updateDateTime, 1000); 
</script>

</body>
</html>
