<!DOCTYPE html>
<html>
<head>
<style>
body {
  background-color: transparent;
  font-family: monospace;
  position: relative;
  width: 100vw;
  height: 0;
  padding-bottom: 56.25%;
  overflow: hidden;
}

.container {
  color: rgb(153, 153, 255);
  padding: 5px 10px;
  font-size: 14px;
  position: fixed;
  bottom: 0;
  right: 0;
  font-weight: bold; /* Make the font bold */
  background-color: rgba(128, 128, 128, 0.3); /* Subtle grey background with shade */
  box-shadow: 0px 2px 4px rgba(0, 0, 0, 0.2); /* Add a subtle shadow */
}
</style>
</head>
<body>

<div class="container">
  <span id="time"></span><br>
  <span id="date"></span>
</div>

<script>
function updateDateTime() {
  const now = new Date();
  const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const dateString = now.toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' });
  
  document.getElementById('time').textContent = timeString;
  document.getElementById('date').textContent = dateString;
}

// Update initially and then every second
updateDateTime();
setInterval(updateDateTime, 1000); 
</script>

</body>
</html>
