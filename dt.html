<!DOCTYPE html>
<html>
<head>
<style>
body {
  background-color: transparent;
  font-family: monospace;
  position: relative;
  width: 100vw;
  height: 0;
  padding-bottom: 56.25%;
  overflow: hidden;
}

.container {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 5px 10px;
  font-size: 14px;
  position: fixed;
  bottom: 2.3vh; /* 50px is approximately 2.3vh of a 1080p screen */
  right: 2.3vw; /* 50px is approximately 2.3vw of a 1920p screen */
  font-weight: bold;
  background-color: rgba(128, 128, 128, 0.3);
  box-shadow: 0px 2px 4px rgba(0, 0, 0, 0.2);
}

#time {
  color: rgb(10, 10, 225);
}

#date {
  color: rgb(10, 10, 255);
}
</style>
</head>
<body>

<div class="container">
  <span id="time"></span><br>
  <span id="date"></span>
</div>

<script>
function updateDateTime() {
  const now = new Date();
  const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
  const dateString = now.toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' });
  
  document.getElementById('time').textContent = timeString;
  document.getElementById('date').textContent = dateString;
}

// Update initially and then every second
updateDateTime();
setInterval(updateDateTime, 1000); 
</script>

</body>
</html>
