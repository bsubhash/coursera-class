<!DOCTYPE html>
<html>
<head>
  <title>Dual Logo and Image Cycles</title>
  <style>
    body, html {
      margin: 0;
      height: 100%;
      overflow: hidden;
    }

    #overlay {
      position: relative;
      width: 100%;
      height: 100%;
      background-color: transparent;
    }

  .logo {
      position: absolute;
      background-size: contain;
      background-repeat: no-repeat;
      width: 150px;   /* Initial width for 1080p */
      height: 100px;  /* Initial height for 1080p */
    }

    #logo1 {
      top: 40px;  /* 40px from the top on 1080p */
      left: 50px; /* 50px from the left on 1080p */
    } 

    #logo2 {
      top: 40px;  /* 40px from the top on 1080p */
      right: 50px; /* 50px from the right on 1080p */
    }

  .image-cycle {
      position: absolute;
      bottom: 15px; /* 15px from the bottom */
      width: 195px;
      height: 85px;
      background-size: contain; /* Maintain aspect ratio */
      background-position: center; /* Center the image */
      background-repeat: no-repeat;
      transition: opacity 1s ease-in-out; /* Add transition for opacity */
    }

    #image-cycle-left {
      left: 55px;   /* 55px from the left */
    }

    #image-cycle-right {
      right: 55px;  /* 55px from the right */
    }

    /* Media queries for responsiveness */
    @media (max-width: 1200px) {
    .logo {
        width: 100px;  /* Adjust width for smaller screens */
        height: 67px; /* Adjust height for smaller screens */
      }
      #logo1 {
        top: 27px;  /* Adjust top for smaller screens */
        left: 33px;  /* Adjust left for smaller screens */
      } 
      #logo2 {
        top: 27px;  /* Adjust top for smaller screens */
        right: 33px;  /* Adjust right for smaller screens */
      }
    .image-cycle {
        width: 130px;  /* Adjust width for smaller screens */
        height: 57px; /* Adjust height for smaller screens */
        bottom: 10px; /* Adjust bottom for smaller screens */
      }
      #image-cycle-left {
        left: 37px;   /* Adjust left for smaller screens */
      }
      #image-cycle-right {
        right: 37px;  /* Adjust right for smaller screens */
      }
    }

    @media (min-width: 3840px) { 
    .logo {
        width: 300px;  /* Double the width for 4K */
        height: 200px; /* Double the height for 4K */
      }
      #logo1 {
        top: 80px;  /* Double the top for 4K */
        left: 100px; /* Double the left for 4K */
      } 
      #logo2 {
        top: 80px;  /* Double the top for 4K */
        right: 100px; /* Double the right for 4K */
      }
    .image-cycle {
        width: 390px;  /* Double the width for 4K */
        height: 170px; /* Double the height for 4K */
        bottom: 30px; /* Double the bottom for 4K */
      }
      #image-cycle-left {
        left: 110px;   /* Double the left for 4K */
      }
      #image-cycle-right {
        right: 110px;  /* Double the right for 4K */
      }
    }
  </style>
</head>
<body>

  <div id="overlay">
    <div id="logo1" class="logo"></div>
    <div id="logo2" class="logo"></div>
    <div id="image-cycle-left" class="image-cycle"></div> 
    <div id="image-cycle-right" class="image-cycle"></div> 
  </div>

  <script defer>
    document.addEventListener('DOMContentLoaded', (event) => {
      // document.getElementById("logo1").style.backgroundImage = "url('crickai_uhd2.png')";
      document.getElementById("logo2").style.backgroundImage = "url('sdopen2025/club.png')"; 

      const imageCycleLeft = document.getElementById("image-cycle-left");
      const imageCycleRight = document.getElementById("image-cycle-right");
      const imageFolderLeft = "sdopen2025/lads/"; 
      const imageFolderRight = "sdopen2025/rads2026/"; 
      const imagesLeft = [
        "image1.png",

      ];
      const imagesRight = [
        "imageA.png",
        "imageB.png",
        "imageC.png",
        "imageD.png",
        "imageE.png",
        "imageF.png",
        "imageG.png",
        "ira.png",
        "sanidli.png",
        "delta.png",
        "GK.png"
      ];
      let currentImageIndexLeft = 0;
      let currentImageIndexRight = 0;

      setInterval(() => {
        const imageUrlLeft = imageFolderLeft + imagesLeft[currentImageIndexLeft];
        imageCycleLeft.style.backgroundImage = `url(${imageUrlLeft})`;
        currentImageIndexLeft = (currentImageIndexLeft + 1) % imagesLeft.length;

        // Fade out the current right image
        imageCycleRight.style.opacity = 0;

        setTimeout(() => {
          const imageUrlRight = imageFolderRight + imagesRight[currentImageIndexRight];
          imageCycleRight.style.backgroundImage = `url(${imageUrlRight})`;
          currentImageIndexRight = (currentImageIndexRight + 1) % imagesRight.length;
          // Fade in the new right image
          imageCycleRight.style.opacity = 1; 
        }, 1000); // 1000 milliseconds = 1 second
      }, 10000);
    });
  </script>

</body>
</html>
