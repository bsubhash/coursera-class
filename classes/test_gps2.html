<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print GPS Coordinates</title>
</head>
<body>
    <!-- Assume the gps_coord(dms) tag is already defined in the system and exists on the page -->
    
    <!-- Placeholder to display the tag's value -->
    <p id="output"></p>

    <script>
        // Access the gps_coord(dms) tag dynamically
        const gpsTag = document.querySelector('gps_coord(dms)');
        const output = document.getElementById('output');

        if (gpsTag) {
            // Print the value of the tag dynamically
            output.textContent = `The GPS coordinates are: ${gpsTag.textContent}`;
        } else {
            output.textContent = "GPS tag not found on the page.";
        }
    </script>
</body>
</html>
