<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location and Date Widget</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #1b2838; /* Darker background */
        }
        .widget-container {
            width: 300px;
            height: 150px;
            background: linear-gradient(135deg, #1e3a8a 0%, #1d4ed8 100%);
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
        }
        .location {
            font-size: 1.2rem;
            font-weight: 600;
            text-align: center;
            margin: 5px 0;
        }
        .date {
            font-size: 1rem;
            font-weight: 400;
        }
    </style>
</head>
<body>
    <div class="widget-container">
        <div class="location" id="location">Loading Location...</div>
        <div class="date" id="date">Loading Date...</div>
    </div>
    <script>
        // Update Date
        const dateElement = document.getElementById('date');
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        dateElement.textContent = new Date().toLocaleDateString(undefined, options);

        // Geolocation API for Location
        const locationElement = document.getElementById('location');
        if ('geolocation' in navigator) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const { latitude, longitude } = position.coords;
                    fetch(`https://geocode.xyz/${latitude},${longitude}?geoit=json`)
                        .then((response) => response.json())
                        .then((data) => {
                            locationElement.textContent = data.city || 'Unknown Location';
                        })
                        .catch(() => {
                            locationElement.textContent = 'Location Unavailable';
                        });
                },
                () => {
                    locationElement.textContent = 'Location Access Denied';
                }
            );
        } else {
            locationElement.textContent = 'Geolocation Not Supported';
        }
    </script>
</body>
</html>
