<!DOCTYPE html>
<html>
<head>
    <title>CricClubs Overlay</title>
    <style>
        body {
            margin: 0;
        }

        #overlay {
            position: relative;
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background-color: transparent;
        }

        #live-score {
            width: 1400px;
            height: 720px;
            position: absolute;
            bottom: 10px; /* 10px margin from the bottom for HD */
            left: 260px;
            clip-path: inset(360px 0 0 0);
            background-color: transparent;
        }

        iframe {
            border: none;
        }

        /* 4K resolution adjustments */
        @media (min-width: 3840px) {
            #overlay {
                width: 3840px;
                height: 2160px;
            }

            #live-score {
                width: 1400px;
                height: 720px;
                left: 520px;
                bottom: 20px; /* 20px margin from the bottom for 4K */
                clip-path: inset(360px 0 0 0);
                transform: scale(2);
                transform-origin: bottom left;
            }
        }
    </style>
</head>
<body>

    <div id="overlay">
        <iframe id="live-score"></iframe>
    </div>

    <script>// Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const fixtureId = urlParams.get('fixtureId');
        const clubId = urlParams.get('clubId');
        const matchId = urlParams.get('matchId');

        // Construct the iframe src based on available parameters
        let iframeSrc = 'https://cricclubs.com/live/CricClubsLive.do?';
        if (matchId) {
            iframeSrc += `matchId=${matchId}&clubId=${clubId}`;
        } else if (fixtureId) {
            iframeSrc += `fixtureId=${fixtureId}&clubId=${clubId}`;
        } else {
            iframeSrc = 'about:blank';
        }

        // Set the iframe src
        document.getElementById('live-score').src = iframeSrc;</script>

</body>
</html>
