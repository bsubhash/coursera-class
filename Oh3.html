<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embedded CricClubs Lower Half</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 2800px;
            height: 1080px; /* Half the height of the original scaled page */
            background: transparent;
        }
        iframe {
            width: 1400px;
            height: 1080px;
            transform: scale(2);
            transform-origin: 0 0;
            border: none;
            background: transparent;
            position: absolute;
            top: -1080px; /* Shift up to show the lower half of the page */
        }
    </style>
</head>
<body>
    <iframe src="https://cricclubs.com/CricClubsLive.do?fixtureId=998&clubId=1001307" allowtransparency="true"></iframe>
</body>
</html>
